<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Details</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="theme.js"></script>
    <script
      src="https://kit.fontawesome.com/720964f193.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <button
      class="theme-toggle floating"
      type="button"
      onclick="toggleTheme()"
      aria-label="Switch theme"
    >
      <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="4.6" />
        <g class="sun-rays">
          <line x1="12" y1="1.6" x2="12" y2="4.2" />
          <line x1="12" y1="19.8" x2="12" y2="22.4" />
          <line x1="1.6" y1="12" x2="4.2" y2="12" />
          <line x1="19.8" y1="12" x2="22.4" y2="12" />
          <line x1="4.6" y1="4.6" x2="6.4" y2="6.4" />
          <line x1="17.6" y1="17.6" x2="19.4" y2="19.4" />
          <line x1="4.6" y1="19.4" x2="6.4" y2="17.6" />
          <line x1="17.6" y1="6.4" x2="19.4" y2="4.6" />
        </g>
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20.5 14.6A8.6 8.6 0 0 1 9.4 3.5a8.6 8.6 0 1 0 11.1 11.1z" />
      </svg>
    </button>
    <div class="detail-page">
      <a href="index.html#portfolio" class="detail-back">
        <i class="fa-solid fa-arrow-left"></i> Back to Projects
      </a>

      <div id="detail-body">
        <p class="detail-eyebrow" id="project-period"></p>
        <h1 id="project-title"></h1>
        <p class="detail-lead" id="project-description"></p>
        <img id="project-cover" class="detail-cover" alt="" />

        <div class="detail-grid">
          <div class="detail-card">
            <h2>What it does</h2>
            <ul id="project-features"></ul>
          </div>
          <div class="detail-card">
            <h2>Tech Stack</h2>
            <div class="tag-list" id="project-tech"></div>
          </div>
        </div>

        <div class="detail-actions">
          <a id="project-link" class="btn btn2" href="#" target="_blank"
            >View Project</a
          >
        </div>
      </div>
    </div>

    <script>
      const projects = {
        omnitrace: {
          title: "OmniTrace - AI Trading Coach",
          period: "July 2026 · Hackathon Winner",
          cover: "Portfolio-Image/omnitrace-image.svg",
          description:
            "OmniTrace is an AI-powered trading coach that lets beginner investors work through the market in plain language instead of trading jargon. It pairs Claude AI and Gemini to drive 20+ natural language trading workflows, and connects to 5+ REST APIs for broker connectivity, paper trading, live order execution, portfolio synchronization and real-time market insights. Built end to end as a functional MVP with a 2-member team during an organization-level hackathon at Table Top Technologies, where it placed 1st.",
          technologies: [
            "Claude AI",
            "Gemini",
            "LLMs",
            "Prompt Engineering",
            "REST APIs",
            "Broker APIs",
          ],
          link: "https://github.com/Gowtham5813",
          features: [
            "20+ natural language trading workflows for beginner investors",
            "5+ REST API integrations including broker connectivity",
            "Paper trading and live order execution",
            "Portfolio synchronization and real-time market insights",
            "Conversational AI trading coach",
          ],
        },
        docbot: {
          title: "AI Document Assistant",
          period: "Feb 2024 - Apr 2024",
          cover: "Portfolio-Image/docbot-image.svg",
          description:
            "An AI-powered document assistant that turns a pile of PDFs into something you can simply ask questions of. Built with Python, LangChain and LLMs, it answers document-based queries with 95% accuracy and uses parallel execution to process files concurrently - lifting document processing capacity by 50% while cutting response time by 30%.",
          technologies: ["Python", "LangChain", "LLMs", "NLP"],
          link: "https://github.com/Gowtham5813/DocBot-using-LangChain-Application.git",
          features: [
            "Answers PDF-based queries with 95% accuracy",
            "Analyzes any uploaded document",
            "Parallel document processing for scalability",
          ],
        },
        ecommerce: {
          title: "E-commerce Platform",
          period: "Personal Project",
          cover: "Portfolio-Image/ecommerce-image.svg",
          description:
            "A shopping platform built in vanilla JavaScript, HTML and CSS - no framework. Users can browse the catalogue, search and filter products, manage a cart that persists across sessions through LocalStorage, and move through checkout in one continuous flow. A ground-up exercise in state management and DOM work without a library doing it for me.",
          technologies: ["HTML", "CSS", "JavaScript", "LocalStorage"],
          link: "https://github.com/Gowtham5813/javascript-amazon-project-main.git",
          features: [
            "User Authentication",
            "Product Search and Filtering",
            "Cart Management",
          ],
        },
        weather: {
          title: "Real-Time Weather Insights Dashboard",
          period: "May 2023 - July 2023",
          cover: "Portfolio-Image/weather-data-image.svg",
          description:
            "A real-time analytics dashboard for weather data, built on Python, Django and SQL with a JavaScript charting front end. Data collection and visualization run automatically, so readings flow in and render without anyone touching them - cutting manual effort by 30%, raising user engagement by 40% and improving operational efficiency by 20%. The processing layer was designed to scale as the volume of incoming data grows.",
          technologies: [
            "JavaScript",
            "HTML",
            "CSS",
            "Python",
            "Django",
            "SQL",
            "Chart.js",
          ],
          link: "https://github.com/Gowtham5813",
          features: [
            "Real-time weather data collection",
            "Interactive charts and insights",
            "Automated data pipeline cutting manual effort by 30%",
          ],
        },
      };

      const params = new URLSearchParams(window.location.search);
      const data = projects[params.get("id")];

      if (!data) {
        document.getElementById("detail-body").innerHTML =
          '<h1>Project Not Found</h1><p class="detail-lead">Pick a project from the portfolio to see its details.</p>';
      } else {
        document.title = data.title;
        document.getElementById("project-period").innerText = data.period;
        document.getElementById("project-title").innerText = data.title;
        document.getElementById("project-description").innerText =
          data.description;

        const cover = document.getElementById("project-cover");
        cover.src = data.cover;
        cover.alt = data.title;

        const tech = document.getElementById("project-tech");
        data.technologies.forEach((t) => {
          const span = document.createElement("span");
          span.innerText = t;
          tech.appendChild(span);
        });

        const featuresList = document.getElementById("project-features");
        data.features.forEach((feature) => {
          const li = document.createElement("li");
          li.innerText = feature;
          featuresList.appendChild(li);
        });

        document.getElementById("project-link").href = data.link;
      }
    </script>
  </body>
</html>
